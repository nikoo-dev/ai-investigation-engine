[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "investigation-engine"
version = "0.1.0"
description = "An evidence-first, multi-step investigation engine with measurable hybrid retrieval."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "qdrant-client>=1.14,<2", "fastembed>=0.6,<1", "httpx>=0.28,<1",
  "pypdf>=5.4,<7", "python-docx>=1.1,<2", "python-multipart>=0.0.20,<1",
  "jinja2>=3.1.6,<4", "numpy>=2.1,<3", "prometheus-client>=0.21,<1",
  "typer>=0.15,<1", "tenacity>=9,<10", "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "playwright>=1.51,<2", "reportlab>=4,<5"]
data = ["datasets>=3.5,<5"]

[project.scripts]
investigate = "investigation.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/investigation"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "docs", "data/evaluation", "data/manifests", "reports", "pyproject.toml", "uv.lock", "README.md", "THIRD_PARTY_NOTICES.md", "Dockerfile", "compose.yml", "render.yaml", "submission.example.json", "submission.json", ".python-version", ".env.example", ".dockerignore", ".gitignore", ".gitattributes", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: external service integration", "model: downloads and runs actual embedding models"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

