services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
    volumes:
      - model_cache:/app/data/cache
    depends_on:
      - qdrant
    restart: unless-stopped
volumes:
  qdrant_data:
  model_cache:
